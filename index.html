
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jabal Hemalaya - Card Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.page {
  position: relative;
  width: 100%;
  max-width: 841px;
  aspect-ratio: 841 / 1870;
  overflow: hidden;
}

.home {
  width: 100%;
  height: 100%;
  display: block;
}

#cardNumber {
  position: absolute;
  left: 11.3%;
  top: 25.9%;
  width: 77%;
  height: 7.4%;
  border: none;
  outline: none;
  background: transparent;
  padding: 0 2.5%;
  font-size: clamp(16px, 3vw, 26px);
  color: #10243a;
}

#showCard {
  position: absolute;
  left: 11.3%;
  top: 34.7%;
  width: 77%;
  height: 7.1%;
  border: none;
  background: transparent;
  cursor: pointer;
}

#result {
  display: none;
  position: absolute;
  left: 11.3%;
  top: 53%;
  width: 77%;
  max-height: 35.5%;
  overflow: auto;
  background: white;
  border-radius: 10px;
}

#result img {
  width: 100%;
  height: auto;
  display: block;
}

#message {
  display: none;
  position: absolute;
  top: 51%;
  left: 11.3%;
  width: 77%;
  text-align: center;
  color: red;
  background: white;
  padding: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="page">

  <!-- Original Homepage Design -->
  <img src="home.webp" class="home">

  <!-- Card Number Input -->
  <input
    type="text"
    id="cardNumber"
    placeholder=""
    aria-label="Enter Card Number"
  >

  <!-- Show ID Card Button -->
  <button id="showCard"
    type="button"
    aria-label="Show ID Card">
  </button>

  <!-- Error Message -->
  <div id="message">
    Invalid Card Number
  </div>

  <!-- Employee ID Card Front + Back Combined -->
  <div id="result">
    <img
      src="employee-card.jpg"
      alt="Employee ID Card"
    >
  </div>

</div>

<script>

// Employee Card Number
const validCardNumber = "JHI-11021";

const input = document.getElementById("cardNumber");
const result = document.getElementById("result");
const message = document.getElementById("message");

// Show ID Card
document.getElementById("showCard").addEventListener("click", function() {

  const enteredNumber = input.value.trim().toUpperCase();

  result.style.display = "none";
  message.style.display = "none";

  if (enteredNumber === validCardNumber) {

    result.style.display = "block";

  } else {

    message.style.display = "block";

  }

});

// Enter key support
input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    document.getElementById("showCard").click();
  }

});

// Clear result when typing
input.addEventListener("input", function() {
  result.style.display = "none";
  message.style.display = "none";
});

</script>

</body>
</html>
