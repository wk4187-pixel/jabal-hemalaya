
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jabal Hemalaya For Inspections</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: white;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  position: relative;
  width: 100%;
  max-width: 841px;
  aspect-ratio: 841 / 1870;
  overflow: hidden;
}

.design {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: fill;
}

#cardNumber {
  position: absolute;
  left: 11.3%;
  top: 25.9%;
  width: 77%;
  height: 7.4%;
  border: none;
  outline: none;
  background: transparent;
  padding: 0 2.5%;
  color: #10243a;
  font-size: clamp(16px, 3.1vw, 26px);
  text-transform: uppercase;
}

#showCard {
  position: absolute;
  left: 11.3%;
  top: 34.7%;
  width: 77%;
  height: 7.1%;
  border: none;
  border-radius: 30px;
  background: transparent;
  cursor: pointer;
}

#showCard:focus-visible {
  outline: 3px solid #b4df2f;
}

#result {
  display: none;
  position: absolute;
  left: 11.3%;
  top: 53%;
  width: 77%;
  max-height: 46.5%;
  overflow: auto;
  background: white;
  border-radius: 8px;
}

#result img {
  width: 100%;
  height: auto;
  display: block;
}

#message {
  display: none;
  position: absolute;
  left: 11.3%;
  top: 51%;
  width: 77%;
  padding: 12px;
  color: #9b1c1c;
  background: white;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

@media (max-width: 520px) {
  #result {
    top: 52.5%;
    max-height: 47%;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- ORIGINAL WEBSITE DESIGN -->
  <img
    class="design"
    src="home.webp"
    alt="Jabal Hemalaya For Inspections"
  >

  <!-- CARD NUMBER INPUT -->
  <input
    id="cardNumber"
    type="text"
    placeholder=""
    autocomplete="off"
    autocapitalize="characters"
  >

  <!-- SHOW ID CARD BUTTON -->
  <button
    id="showCard"
    type="button"
    aria-label="Show ID Card">
  </button>

  <!-- EMPLOYEE CARD RESULT -->
  <div id="result">
    <img
      id="cardImage"
      alt="Employee ID Card Front and Back"
    >
  </div>

  <div id="message"></div>

</main>

<script>

// EMPLOYEE DATABASE
// Search only by CARD NUMBER

const employees = {

  "JHI-11063": {
    name: "NASIR KHAN",
    image: "nasir-khan.jpg"
  },

  "JHI-11022": {
    name: "AZIZ ULLAH",
    image: "aziz-ullah.jpg"
  },

  "JHI-11058": {
    name: "FARAZ KHAN",
    image: "faraz-khan.jpg"
  },

  "JHI-11072": {
    name: "MUHAMMAD IDREES",
    image: "muhammad-idrees.jpg"
  }

};

// GET WEBSITE ELEMENTS

const input = document.getElementById("cardNumber");

const result = document.getElementById("result");

const cardImage = document.getElementById("cardImage");

const message = document.getElementById("message");


// SHOW EMPLOYEE ID CARD

function showEmployeeCard() {

  const entered = input.value.trim().toUpperCase();

  result.style.display = "none";

  cardImage.removeAttribute("src");

  message.style.display = "none";

  // FIND EMPLOYEE BY CARD NUMBER

  const employee = employees[entered];

  // INVALID CARD NUMBER

  if (!employee) {

    message.textContent =
      "Invalid Card Number. Please check and try again.";

    message.style.display = "block";

    return;
  }

  // DISPLAY COMPLETE CARD IMAGE

  cardImage.alt =
    employee.name + " - Complete Employee ID Card";

  cardImage.onload = function() {

    result.style.display = "block";

  };

  cardImage.onerror = function() {

    message.textContent =
      "Card image could not be loaded. Please upload all JPG files with index.html.";

    message.style.display = "block";

  };

  cardImage.src = employee.image;

}


// BUTTON CLICK

document
  .getElementById("showCard")
  .addEventListener("click", showEmployeeCard);


// ENTER KEY SEARCH

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    showEmployeeCard();

  }

});


// HIDE OLD RESULT WHEN INPUT CHANGES

input.addEventListener("input", function() {

  result.style.display = "none";

  message.style.display = "none";

});

</script>

</body>
</html>
